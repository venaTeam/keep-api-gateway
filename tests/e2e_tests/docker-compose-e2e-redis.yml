services:
  keep-frontend:
    extends:
      file: docker-compose.common.yml
      service: keep-frontend-common
    build:
      context: ./keep-ui/
      dockerfile: ../docker/Dockerfile.ui
    environment:
      - AUTH_TYPE=NO_AUTH
      - API_URL=http://keep-backend:8080
      - SENTRY_DISABLED=true
    depends_on:
      - keep-backend

  keep-backend:
    extends:
      file: docker-compose.common.yml
      service: keep-backend-common
    image: us-central1-docker.pkg.dev/keephq/keep/keep-api:latest
    environment:
      - AUTH_TYPE=NO_AUTH
      - DATABASE_CONNECTION_STRING=sqlite:///./newdb.db?check_same_thread=False
      - SECRET_MANAGER_DIRECTORY=/appֿ
      - REDIS=true
      - REDIS_HOST=keep-arq-redis
      - REDIS_PORT=6379
    depends_on:
      - keep-redis
    volumes:
      - keep-db-data:/app

  keep-worker:
    extends:
      file: docker-compose.common.yml
      service: keep-backend-common
    image: us-central1-docker.pkg.dev/keephq/keep/keep-api:latest
    environment:
      - AUTH_TYPE=NO_AUTH
      - DATABASE_CONNECTION_STRING=sqlite:///./newdb.db?check_same_thread=False
      - SECRET_MANAGER_DIRECTORY=/app
      - REDIS=true
      - REDIS_HOST=keep-arq-redis
      - REDIS_PORT=6379
    command: uvicorn keep.event_handler.main:app
    depends_on:
      - keep-redis
    volumes:
      - keep-db-data:/app



  keep-redis:
    image: redis/redis-stack
    ports:
      - "6379:6379"
      - "8081:8001"

volumes:
  postgres-data:
  keep-db-data: